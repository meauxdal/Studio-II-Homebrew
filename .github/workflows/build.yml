name: Build cartridges

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build every cartridge
        run: python build.py

      - name: Upload cartridges
        uses: actions/upload-artifact@v7
        with:
          name: studio-ii-homebrew
          path: |
            build/**/*.bin
            build/**/*.st2
            build/**/*.rom
          if-no-files-found: error
