name: Build cartridges

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build every cartridge
        run: python build.py

      - name: Upload cartridges
        uses: actions/upload-artifact@v4
        with:
          name: studio-ii-homebrew
          path: |
            build/**/*.bin
            build/**/*.st2
            build/**/*.rom
